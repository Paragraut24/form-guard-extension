<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Threats — PhishGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global-threats.css">
  <!-- Apply stored theme immediately to prevent flash -->
  <script>
    (function () {
      try {
        chrome.storage.local.get('phishguard_theme', function (r) {
          document.documentElement.setAttribute('data-theme', r.phishguard_theme || 'dark');
        });
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10
                     15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z" />
          </svg>
        </div>
        <div class="header-text">
          <h1>Global Threat Feed</h1>
          <p>Recently reported phishing URLs from security communities worldwide</p>
        </div>
      </div>

      <!-- Header right: Refresh + Theme toggle -->
      <div class="header-actions">
        <button class="refresh-btn" id="refreshBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
          </svg>
          <span>Refresh</span>
        </button>

        <button class="theme-btn" id="themeToggle" title="Toggle light / dark mode" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="totalThreats">0</div>
        <div class="stat-label">Total Threats</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activeThreats">0</div>
        <div class="stat-label">Active Threats</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="lastUpdated">Never</div>
        <div class="stat-label">Last Updated</div>
      </div>
    </div>

    <!-- Attribution -->
    <div style="text-align: center; margin: 20px auto; padding: 12px; background: rgba(102, 126, 234, 0.1); border-radius: 8px; border: 1px solid rgba(102, 126, 234, 0.3); max-width: 600px;">
      <p style="margin: 0; font-size: 14px; opacity: 0.8;">
        ℹ️ Threat intelligence data provided by <a href="https://openphish.com" target="_blank" style="color: #667eea; text-decoration: none; font-weight: 600;">OpenPhish.com</a>
      </p>
    </div>

    <!-- Threats Container -->
    <div class="threats-container">
      <div class="threats-header">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          Active Threats
        </h2>
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="banking">Banking</button>
          <button class="filter-btn" data-filter="payment">Payment</button>
          <button class="filter-btn" data-filter="social">Social</button>
        </div>
      </div>

      <!-- Threats Grid -->
      <div class="threats-grid" id="threatsGrid">
        <div class="loading-container">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading global threats...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script>
    ThemeManager.loadAndApply();
    document.getElementById('themeToggle').addEventListener('click', () => ThemeManager.toggle());
  </script>
  <script src="global-threats.js"></script>
</body>

</html>
